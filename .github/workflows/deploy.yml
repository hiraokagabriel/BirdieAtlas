name: Deploy

# Roda depois do CI verde na main: aplica as migrations no banco de produção (Neon) e só então
# dispara o deploy da API no Render (Deploy Hook). O web é publicado pela integração Git da Vercel.
# Sem os secrets configurados, o job termina sem fazer nada (repositório ainda sem produção).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Um deploy por vez; um novo merge espera o anterior terminar (nunca cancela migration no meio).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-api:
    name: Migrations e deploy da API
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Conferir secrets
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Secrets de produção ausentes: deploy pulado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (o commit que passou no CI)
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # Antes do código novo: as migrations seguem expandir e contrair, então o código antigo convive com elas.
      - name: Migrations (drizzle-kit migrate, nunca db:push)
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm --filter @birdie-atlas/api db:migrate

      - name: Disparar deploy da API no Render
        if: steps.secrets.outputs.ready == 'true'
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
